<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My AI Bot</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f2f2f2;
        }

        .app {
            max-width: 600px;
            margin: auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: white;
        }

        header {
            background: #111827;
            color: white;
            padding: 18px;
            text-align: center;
        }

        header h2 {
            margin: 0;
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .message {
            padding: 10px 14px;
            margin: 8px 0;
            border-radius: 12px;
            max-width: 80%;
            word-wrap: break-word;
        }

        .user {
            background: #dbeafe;
            margin-left: auto;
            text-align: right;
        }

        .bot {
            background: #eeeeee;
            margin-right: auto;
        }

        .input-area {
            display: flex;
            padding: 10px;
            border-top: 1px solid #ddd;
        }

        #message {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            margin-left: 8px;
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
        }

        button:disabled {
            background: #999;
        }
    </style>
</head>

<body>

<div class="app">

    <header>
        <h2>🤖 My AI Bot</h2>
        <p>বাংলা + English AI Assistant</p>
    </header>

    <div id="chat">
        <div class="message bot">
            👋 হ্যালো! আমি তোমার Personal AI Bot। আমাকে কিছু জিজ্ঞেস করো।
        </div>
    </div>

    <div class="input-area">
        <input
            id="message"
            type="text"
            placeholder="এখানে প্রশ্ন লিখুন..."
            autocomplete="off"
        >

        <button id="send">Send</button>
    </div>

</div>

<script>

const chat = document.getElementById("chat");
const messageInput = document.getElementById("message");
const sendButton = document.getElementById("send");

function addMessage(text, type) {

    const div = document.createElement("div");

    div.className = "message " + type;

    div.textContent = text;

    chat.appendChild(div);

    chat.scrollTop = chat.scrollHeight;
}

async function sendMessage() {

    const message = messageInput.value.trim();

    if (!message) return;

    addMessage(message, "user");

    messageInput.value = "";

    sendButton.disabled = true;

    addMessage("🤔 ভাবছি...", "bot");

    try {

        const response = await fetch("/chat", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                message: message
            })

        });

        const data = await response.json();

        chat.lastElementChild.remove();

        if (data.reply) {

            addMessage(data.reply, "bot");

        } else {

            addMessage("দুঃখিত, উত্তর পাওয়া যায়নি।", "bot");

        }

    } catch (error) {

        chat.lastElementChild.remove();

        addMessage(
            "❌ Server-এর সাথে যোগাযোগ করা যাচ্ছে না।",
            "bot"
        );

    }

    sendButton.disabled = false;

    messageInput.focus();
}

sendButton.addEventListener("click", sendMessage);

messageInput.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {

        sendMessage();

    }

});

</script>

</body>
</html>
