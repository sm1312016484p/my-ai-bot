<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Personal AI Bot</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef2f7;
        }

        .app {
            max-width: 650px;
            height: 100vh;
            margin: auto;
            background: white;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #111827;
            color: white;
            text-align: center;
            padding: 15px;
        }

        header h2 {
            margin: 0;
        }

        #status {
            font-size: 13px;
            color: #bbf7d0;
            margin-top: 5px;
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .message {
            max-width: 85%;
            padding: 11px 14px;
            margin: 9px 0;
            border-radius: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .user {
            margin-left: auto;
            background: #dbeafe;
            text-align: right;
        }

        .bot {
            margin-right: auto;
            background: #f1f5f9;
        }

        .typing {
            font-style: italic;
            color: #666;
        }

        .controls {
            display: flex;
            gap: 7px;
            padding: 10px;
            border-top: 1px solid #ddd;
        }

        #message {
            flex: 1;
            padding: 12px;
            border: 1px solid #bbb;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 10px 13px;
            font-size: 16px;
            cursor: pointer;
        }

        #send {
            background: #2563eb;
            color: white;
        }

        #mic {
            background: #dc2626;
            color: white;
        }

        #voice {
            background: #16a34a;
            color: white;
        }

        .bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: #f8fafc;
            border-top: 1px solid #ddd;
            font-size: 13px;
        }

        select {
            padding: 6px;
            border-radius: 7px;
        }
    </style>
</head>

<body>

<div class="app">

    <header>
        <h2>🤖 My Personal AI Bot</h2>
        <div id="status">● Online</div>
    </header>

    <div id="chat">
        <div class="message bot">
            👋 হ্যালো! আমি তোমার Personal AI Bot।

            তুমি বাংলা অথবা English-এ লিখতে বা কথা বলতে পারো।
        </div>
    </div>

    <div class="controls">

        <input
            id="message"
            type="text"
            placeholder="এখানে প্রশ্ন লিখুন..."
            autocomplete="off"
        >

        <button id="mic" title="Voice Command">🎙️</button>

        <button id="send">➤</button>

    </div>

    <div class="bottom">

        <select id="language">
            <option value="bn-BD">বাংলা</option>
            <option value="en-US">English</option>
        </select>

        <button id="voice" title="Voice Reply">
            🔊 Voice
        </button>

    </div>

</div>

<script>

const chat = document.getElementById("chat");
const messageInput = document.getElementById("message");
const sendButton = document.getElementById("send");
const micButton = document.getElementById("mic");
const voiceButton = document.getElementById("voice");
const languageSelect = document.getElementById("language");

let lastBotReply = "";

function addMessage(text, type) {

    const div = document.createElement("div");

    div.className = "message " + type;

    div.textContent = text;

    chat.appendChild(div);

    chat.scrollTop = chat.scrollHeight;

    return div;
}

async function sendMessage() {

    const message = messageInput.value.trim();

    if (!message) return;

    addMessage(message, "user");

    messageInput.value = "";

    sendButton.disabled = true;

    const typing = addMessage("🤔 ভাবছি...", "bot typing");

    try {

        const response = await fetch("/chat", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                message: message
            })

        });

        const data = await response.json();

        typing.remove();

        if (data.reply) {

            lastBotReply = data.reply;

            addMessage(data.reply, "bot");

        } else {

            addMessage(
                "❌ " + (data.details || "উত্তর পাওয়া যায়নি।"),
                "bot"
            );

        }

    } catch (error) {

        typing.remove();

        addMessage(
            "❌ Server-এর সাথে যোগাযোগ করা যাচ্ছে না।",
            "bot"
        );
    }

    sendButton.disabled = false;

    messageInput.focus();
}

sendButton.addEventListener("click", sendMessage);

messageInput.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        sendMessage();
    }

});


/* 🎙️ Voice Command */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let recognition = null;

if (SpeechRecognition) {

    recognition = new SpeechRecognition();

    recognition.continuous = false;

    recognition.interimResults = false;

    recognition.lang = "bn-BD";

    recognition.onstart = function() {

        micButton.textContent = "🔴";

    };

    recognition.onend = function() {

        micButton.textContent = "🎙️";

    };

    recognition.onresult = function(event) {

        const text =
            event.results[0][0].transcript;

        messageInput.value = text;

        sendMessage();
    };

    micButton.addEventListener("click", function() {

        recognition.lang =
            languageSelect.value;

        recognition.start();

    });

} else {

    micButton.addEventListener("click", function() {

        alert(
            "এই browser-এ Voice Command support নেই। Chrome ব্যবহার করে চেষ্টা করুন।"
        );

    });

}


/* 🔊 Voice Reply */

voiceButton.addEventListener("click", function() {

    if (!lastBotReply) {

        alert("আগে Bot-এর একটি উত্তর নিন।");

        return;
    }

    if (!("speechSynthesis" in window)) {

        alert(
            "এই browser-এ Voice Reply support নেই।"
        );

        return;
    }

    speechSynthesis.cancel();

    const speech =
        new SpeechSynthesisUtterance(lastBotReply);

    speech.lang =
        languageSelect.value;

    speech.rate = 1;

    speech.pitch = 1;

    speechSynthesis.speak(speech);

});

</script>

</body>
</html>
